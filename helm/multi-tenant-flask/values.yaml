tenant: user1

image:
  repository: bhagyashripatil/multi-tenant-flask
  tag: v1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

containerPort: 5000

ingress:
  enabled: true
  className: nginx

  host: user1.example.com

  tls:
    enabled: true
    secretName: user1-tls

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
